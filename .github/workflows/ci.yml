name: CI

on:
  pull_request:
    branches: [main]
  # Merges to main run these through release.yml rather than triggering here,
  # so a merge produces one run instead of two. Calling them keeps the release
  # gate identical to what PRs are validated against — it cannot drift.
  workflow_call:

# Cancel superseded runs on the same branch or PR. Releases must never be
# cancelled mid-flight, so the release workflow sets its own group.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    name: Build and test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest

    # Angular 22 requires ^22.22.3 || ^24.15.0 || >=26.0.0 — Node 20 is not
    # supported at all. 22 and 24 are the LTS lines and must pass; 26 is the
    # current line, run for early warning but not allowed to block a release.
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
        include:
          - node: 26
            experimental: true

    continue-on-error: ${{ matrix.experimental == true }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Both manifests carry a version; only the library's is published.
      - name: Check the versions are in step
        run: npm run lint:versions

      - name: Check the CSS theming contract
        run: npm run lint:tokens

      # The demo resolves `ngx-toast-alerts` through a tsconfig path mapping to
      # dist/, so the library must exist before anything type-checks it. Every
      # script below builds it first, so they also work on a clean checkout.
      - name: Build the library
        run: npm run build

      # The root tsconfig is what editors resolve spec files against, so a
      # green `ng test` alone can still leave red squiggles in the IDE.
      - name: Type-check the workspace
        run: npm run typecheck

      - name: Test the library
        run: npm test

      - name: Test the demo app
        run: npm run test:demo

      - name: Build the demo app
        run: npm run build:demo

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Only Chromium is used, so skip the other browser downloads.
      - name: Install Playwright's Chromium
        run: npx playwright install --with-deps chromium

      # Playwright's webServer runs `npm start`, which builds the library
      # before serving the demo.
      - name: Run end-to-end tests
        run: npm run e2e

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  pack:
    name: Verify the published package
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Lists what would ship, so a missing file shows up in the log.
      - name: Pack the tarball
        run: npm run pack:lib

      # Installs that tarball into a throwaway consumer outside the workspace
      # and type-checks a real import against it. The demo app resolves the
      # library through a tsconfig path mapping to dist/, so it can never catch
      # a broken exports map, a missing types entry or a wrong peer range.
      - name: Install the tarball and type-check a consumer
        run: npm run verify:package
